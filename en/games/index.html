    <div style="padding-bottom: 40px;">
        <h2>here are some games to play</h2>
        <a href="/en/games/snake/index.html" class="boldwhenhover-simple" id="popup-gameteaser">
            <p>snake</p>
            <canvas id="game-teaser" heigth="16"></canvas>
        </a>

        <script>
            var canvas = document.getElementById('game-teaser');
            var context = canvas.getContext('2d');

            var grid = 16;
            canvas.height = grid;                // drawing height = one cell
            canvas.style.height = grid + 'px';   // displayed height, same value → no stretching

            var cols;
            var count = 0;
            var speed = 6;

            var snake = {
                x: 0,
                cells: [],
                length: 4
            };

            var apple = { x: 0 };
            var score = 0;

            // make the drawing width match the displayed width
            function resizeCanvas() {
                // round down to a multiple of grid so cells line up exactly
                canvas.width = Math.floor(canvas.clientWidth / grid) * grid;
                cols = canvas.width / grid;

                // keep snake and apple inside the new width
                if (snake.x >= canvas.width) {
                    snake.x = 0;
                    snake.cells = [];
                }
                if (apple.x >= canvas.width) {
                    placeApple();
                }
            }

            function getRandomInt(min, max) {
                return Math.floor(Math.random() * (max - min)) + min;
            }

            // put the apple on a random cell that the snake doesn't occupy
            function placeApple() {
                do {
                    apple.x = getRandomInt(0, cols) * grid;
                } while (snake.cells.some(function (cell) { return cell.x === apple.x; }));
            }

            resizeCanvas();
            placeApple();
            window.addEventListener('resize', resizeCanvas);

            function loop() {
                requestAnimationFrame(loop);

                if (++count < speed) {
                    return;
                }
                count = 0;

                context.clearRect(0, 0, canvas.width, canvas.height);

                // move right, wrap around at the end of the line
                snake.x += grid;
                if (snake.x >= canvas.width) {
                    snake.x = 0;
                }

                // keep track of the body: front of the array is the head
                snake.cells.unshift({ x: snake.x });
                if (snake.cells.length > snake.length) {
                    snake.cells.pop();
                }

                // head reaches the apple: count it and place a new one (no growing)
                if (snake.x === apple.x) {
                    score++;
                    placeApple();
                }

                // draw apple
                context.fillStyle = 'red';
                context.fillRect(apple.x, 0, grid - 1, grid - 1);

                // draw snake
                context.fillStyle = 'darkolivegreen';
                snake.cells.forEach(function (cell) {
                    context.fillRect(cell.x, 0, grid - 1, grid - 1);
                });
            }

            requestAnimationFrame(loop);
        </script>

        <a id="popup-gameteaser" class="boldwhenhover-simple" href="/en/games/dino/index.html">
            <p>dino</p>
            <img id="game-teaser" src="/icons/dino.png" style="height: 26px; width: auto;">
